services:
  - type: web
    name: piloton1231-vrchat-resolver
    runtime: docker
    plan: free
    region: singapore
    rootDir: resolver
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - video.piloton.cc
    envVars:
      - key: CACHE_SECONDS
        value: "180"
      - key: RATE_LIMIT
        value: "12"
      - key: RATE_WINDOW_SECONDS
        value: "60"
      - key: MAX_CONCURRENT_EXTRACTS
        value: "2"
      - key: PLAYER_CLIENTS
        value: mweb,android_vr
      - key: JS_RUNTIME
        value: node
      - key: POT_PROVIDER
        value: "1"
      - key: FORCE_IPV4
        value: "1"
      - key: KSYNC_FALLBACK
        value: "0"
