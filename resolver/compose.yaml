name: piloton-video

services:
  resolver:
    build: .
    restart: unless-stopped
    init: true
    environment:
      CACHE_SECONDS: ${CACHE_SECONDS:-180}
      EDGE_CACHE_SECONDS: ${EDGE_CACHE_SECONDS:-180}
      STREAM_EDGE_CACHE_SECONDS: ${STREAM_EDGE_CACHE_SECONDS:-20}
      RATE_LIMIT: ${RATE_LIMIT:-12}
      RATE_WINDOW_SECONDS: ${RATE_WINDOW_SECONDS:-60}
      VISIT_RATE_LIMIT: ${VISIT_RATE_LIMIT:-6}
      VISIT_RATE_WINDOW_SECONDS: ${VISIT_RATE_WINDOW_SECONDS:-60}
      TRUSTED_CLIENT_IP_HEADER: X-Piloton-Client-IP
      MAX_CONCURRENT_EXTRACTS: ${MAX_CONCURRENT_EXTRACTS:-2}
      PLAYER_CLIENTS: ${PLAYER_CLIENTS:-web_embedded,mweb,android_vr}
      PLAYER_TEST_PREVIEW_SECONDS: ${PLAYER_TEST_PREVIEW_SECONDS:-12}
      VISITOR_COUNT_FILE: /var/data/visitor-count.json
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-}
      YOUTUBE_COOKIE_FILE: /run/youtube-cookies.txt
      JAPAN_PROXY_URL: ${JAPAN_PROXY_URL:-}
    expose:
      - "8000"
    volumes:
      - /opt/piloton-private-niconico:/run/private-niconico:ro
      - /opt/piloton-youtube-cookies.txt:/run/youtube-cookies.txt:ro
      - visitor_data:/var/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1400m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      resolver:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      RESOLVER_DOMAIN: ${RESOLVER_DOMAIN:-video.piloton.cc}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  visitor_data:
