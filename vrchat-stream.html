<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://video.piloton.cc; worker-src 'self' blob:; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>VRChat URL Converterへ移動します</title>
  <link rel="stylesheet" href="liquid-glass.css">
  <script src="theme.js"></script>
  <script>
    const destination = `vrchat-youtube.html${window.location.search}${window.location.hash}`;
    window.location.replace(destination);
  </script>
</head>
<body class="redirect-page">
  <main class="redirect-card">
    <div class="kicker">Redirecting</div>
    <h1>移動しています</h1>
    <p>VRChat URL Converterを自動で開きます。</p>
    <a id="destination-link" href="vrchat-youtube.html">VRChat URL Converterを開く</a>
  </main>
  <script>
    document.getElementById('destination-link').href = `vrchat-youtube.html${window.location.search}${window.location.hash}`;
  </script>
</body>
</html>
