<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>VRChat URL Converterへ移動します</title>
  <script>
    const destination = `vrchat-youtube.html${window.location.search}${window.location.hash}`;
    window.location.replace(destination);
  </script>
</head>
<body>
  <p><a id="destination-link" href="vrchat-youtube.html">統合されたVRChat URL Converterを開く</a></p>
  <script>
    document.getElementById('destination-link').href = `vrchat-youtube.html${window.location.search}${window.location.hash}`;
  </script>
</body>
</html>
