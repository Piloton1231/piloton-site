<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="application-name" content="Pornhub ロゴジェネレーター">
  <meta name="description" content="簡単にあなたの Pornhub スタイルのロゴを作成">
  <meta name="keywords" content="Pornhub ロゴ, Pornhub アイコン, ジェネレーター, ロゴ">
  <title>Pornhub ロゴジェネレーター</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="gate-theme.css">
  <style>
    .logo-stage {
      min-height: min(760px, calc(100vh - 138px));
    }

    .logo-stage::before {
      content: "";
      position: absolute;
      top: -240px;
      right: -180px;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: conic-gradient(from 30deg, rgba(255, 177, 74, 0.18), rgba(255, 62, 219, 0.14), rgba(61, 247, 255, 0.12), rgba(255, 177, 74, 0.18));
      filter: blur(2px);
      animation: logoHalo 20s linear infinite;
      pointer-events: none;
    }

    @keyframes logoHalo {
      to { transform: rotate(360deg); }
    }

    .stage-content {
      position: relative;
      z-index: 1;
    }

    .stage-intro {
      padding-bottom: 26px;
      border-bottom: 1px solid rgba(111, 238, 255, 0.18);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
      margin-top: 26px;
    }

    .field-group {
      grid-column: span 3;
      min-width: 0;
    }

    .field-group.half {
      grid-column: span 6;
    }

    .field-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--soft);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.4;
    }

    .form-control {
      min-height: 46px;
      padding: 10px 13px;
    }

    select.form-control {
      color-scheme: dark;
      cursor: pointer;
    }

    input[type="color"].form-control {
      padding: 7px;
      cursor: pointer;
    }

    #pornhub-bg {
      position: fixed;
      left: -99999px;
      width: 480px;
      height: 480px;
      margin-top: 32px;
      background: #000000;
    }

    #porn-text {
      color: #ffffff;
      font-size: 100px;
    }

    #hub-text {
      padding: 8px;
      border-radius: 8px;
      color: #000000;
      background: rgb(254, 154, 0);
      font-size: 100px;
    }

    .text-line {
      width: 100%;
      height: 100%;
    }

    .text-line tr {
      height: 100%;
    }

    .text-line td {
      text-align: center;
    }

    .preview-section {
      display: grid;
      justify-items: center;
      gap: 16px;
      margin-top: clamp(28px, 5vw, 52px);
    }

    #child {
      display: grid;
      place-items: center;
      width: min(100%, 540px);
      min-height: 240px;
      padding: clamp(14px, 2.5vw, 26px);
      border: 1px solid rgba(255, 177, 74, 0.24);
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(255, 177, 74, 0.1), rgba(255, 62, 219, 0.08)),
        rgba(2, 8, 24, 0.72);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.3), 0 0 32px rgba(255, 177, 74, 0.08);
      overflow: hidden;
    }

    #child canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      border-radius: 16px;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.38);
    }

    .download-area {
      display: grid;
      justify-items: center;
      gap: 10px;
      color: var(--soft);
      font-size: 13px;
      text-align: center;
    }

    .download-area p {
      margin: 0;
    }

    .download-button {
      border-color: rgba(255, 177, 74, 0.44);
      background:
        linear-gradient(135deg, rgba(255, 177, 74, 0.3), rgba(255, 62, 219, 0.18)),
        rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 820px) {
      .field-group,
      .field-group.half {
        grid-column: span 6;
      }
    }

    @media (max-width: 560px) {
      .logo-stage {
        padding-inline: 16px;
      }

      .stage-intro {
        padding-bottom: 20px;
      }

      .field-group,
      .field-group.half {
        grid-column: 1 / -1;
      }

      .form-grid {
        gap: 13px;
      }

      #child {
        min-height: 160px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body class="gate-page">
  <main class="gate-shell">
    <header class="gate-topbar" aria-label="サイトヘッダー">
      <div class="gate-brand">
        <span class="gate-brand-mark" aria-hidden="true"></span>
        Pii-chan Future Museum
      </div>
      <span class="gate-label">GATE 03</span>
      <a class="home-link return-button" href="index.html">Return to HOME</a>
    </header>

    <section class="gate-stage logo-stage" aria-labelledby="logo-title">
      <div class="stage-content">
        <div class="stage-intro">
          <h1 class="gate-heading" id="logo-title">Pornhub ロゴジェネレーター</h1>
          <p class="gate-copy">あなたの Pornhub スタイルのロゴをカスタマイズ</p>
        </div>

        <div class="form-grid">
          <div class="field-group half">
            <label for="porn">左側のテキスト（白色）</label>
            <input type="text" id="porn" value="Porn" class="museum-field form-control">
          </div>
          <div class="field-group half">
            <label for="hub">右側のテキスト（黒色）</label>
            <input type="text" id="hub" value="Hub" class="museum-field form-control">
          </div>
          <div class="field-group">
            <label for="fontsize">フォントサイズ(px)</label>
            <input type="number" id="fontsize" value="100" class="museum-field form-control">
          </div>
          <div class="field-group">
            <label for="bold">太字</label>
            <select class="museum-field form-control" id="bold">
              <option value="bold" selected>有効</option>
              <option value="300">無効</option>
            </select>
          </div>
          <div class="field-group">
            <label for="bgwidth">背景の幅(px)</label>
            <input type="number" id="bgwidth" value="480" class="museum-field form-control">
          </div>
          <div class="field-group">
            <label for="bgheight">背景の高さ(px)</label>
            <input type="number" id="bgheight" value="480" class="museum-field form-control">
          </div>
          <div class="field-group">
            <label for="bgcolor">背景色</label>
            <input type="color" id="bgcolor" value="#000000" class="museum-field form-control">
          </div>
          <div class="field-group">
            <label for="rightbgcolor">右側の背景色</label>
            <input type="color" id="rightbgcolor" value="#FE9A00" class="museum-field form-control">
          </div>
          <div class="field-group">
            <label for="leftcolor">左側の文字色</label>
            <input type="color" id="leftcolor" value="#FFFFFF" class="museum-field form-control">
          </div>
          <div class="field-group">
            <label for="rightcolor">右側の文字色</label>
            <input type="color" id="rightcolor" value="#000000" class="museum-field form-control">
          </div>
        </div>

        <div id="pornhub-bg" aria-hidden="true">
          <table class="text-line">
            <tr>
              <td>
                <span id="porn-text">Porn</span>
                <span id="hub-text">Hub</span>
              </td>
            </tr>
          </table>
        </div>

        <div class="preview-section">
          <div id="child" aria-live="polite"></div>
          <div class="download-area">
            <p>
              <button class="museum-button download-button" type="button" onclick="download(saveAsPNG(canvasObj))">画像をダウンロード</button>
            </p>
            <p>右クリックで画像を保存することもできます</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    let canvasObj;

    function renderLogo() {
      const porn = document.getElementById('porn');
      const hub = document.getElementById('hub');
      const bold = document.getElementById('bold');
      const leftcolor = document.getElementById('leftcolor');
      const rightcolor = document.getElementById('rightcolor');
      const rightbgcolor = document.getElementById('rightbgcolor');
      const fontsize = document.getElementById('fontsize');
      const bgwidth = document.getElementById('bgwidth');
      const bgheight = document.getElementById('bgheight');
      const bgcolor = document.getElementById('bgcolor');
      const pornText = document.getElementById('porn-text');
      const hubText = document.getElementById('hub-text');
      const logoBackground = document.getElementById('pornhub-bg');

      pornText.textContent = porn.value;
      pornText.style.fontWeight = bold.value;
      pornText.style.color = leftcolor.value;
      hubText.textContent = hub.value;
      hubText.style.fontWeight = bold.value;
      hubText.style.color = rightcolor.value;
      hubText.style.background = rightbgcolor.value;
      pornText.style.fontSize = fontsize.value + 'px';
      hubText.style.fontSize = fontsize.value + 'px';
      logoBackground.style.width = bgwidth.value + 'px';
      logoBackground.style.height = bgheight.value + 'px';
      logoBackground.style.backgroundColor = bgcolor.value;

      html2canvas(logoBackground).then(canvas => {
        canvasObj = canvas;
        const child = document.getElementById('child');
        child.replaceChildren(canvas);
      });
    }

    window.addEventListener('load', () => {
      renderLogo();
      setInterval(renderLogo, 1000);
    });

    function saveAsPNG(canvas) {
      return canvas.toDataURL('image/png');
    }

    function download(url) {
      const link = document.createElement('a');
      link.download = 'Logo_' + clearText(
        document.getElementById('porn').value + document.getElementById('hub').value
      ) + '-' + document.getElementById('fontsize').value + '-' + document.getElementById('bgwidth').value + 'x' + document.getElementById('bgheight').value + 'px.png';
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function clearText(str) {
      return str.replace('/', '_').replace('\\', '_').replace(':', '_').replace('*', '_').replace('?', '_').replace('<', '_').replace('>', '_').replace('|', '_');
    }
  </script>
</body>
</html>
