<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豪華ルーレット</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
  <link rel="stylesheet" href="gate-theme.css">
  <style>
    [v-cloak] { display: none; }

    #app { min-height: 100vh; }

    .roulette-stage {
      display: grid;
      align-content: center;
      min-height: min(720px, calc(100vh - 138px));
    }

    .roulette-stage::before {
      content: "";
      position: absolute;
      top: -210px;
      right: -160px;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(61, 247, 255, 0.28);
      border-radius: 50%;
      background: conic-gradient(from 45deg, transparent, rgba(61, 247, 255, 0.16), rgba(255, 62, 219, 0.16), transparent);
      animation: rouletteHalo 18s linear infinite;
      pointer-events: none;
    }

    @keyframes rouletteHalo {
      to { transform: rotate(360deg); }
    }

    .stage-intro,
    .main-container {
      position: relative;
      z-index: 1;
    }

    .stage-intro {
      margin-bottom: clamp(24px, 4vw, 42px);
    }

    .main-container {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(260px, 0.72fr);
      gap: clamp(24px, 5vw, 64px);
      align-items: center;
    }

    .roulette-container {
      display: grid;
      justify-items: center;
      gap: 18px;
      min-width: 0;
    }

    .wheel-frame {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: drop-shadow(0 0 24px rgba(61, 247, 255, 0.26));
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(61, 247, 255, 0.72);
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 28%, rgba(255, 255, 255, 0.08), transparent 30%),
        rgba(2, 8, 24, 0.84);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 0 26px rgba(61, 247, 255, 0.34),
        0 0 54px rgba(141, 92, 255, 0.2);
    }

    .pointer {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -18px;
      width: 0;
      height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-right: 46px solid var(--ink);
      filter: drop-shadow(0 0 10px rgba(61, 247, 255, 0.8));
      transform: translate(50%, -50%);
    }

    .right-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
      padding: clamp(18px, 3vw, 28px);
      border-radius: 26px;
    }

    textarea {
      min-height: 190px;
      padding: 16px;
      resize: vertical;
      line-height: 1.7;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #spin-btn {
      border-color: rgba(124, 255, 196, 0.44);
      background:
        linear-gradient(135deg, rgba(124, 255, 196, 0.3), rgba(61, 247, 255, 0.18)),
        rgba(255, 255, 255, 0.08);
    }

    #reset-btn {
      border-color: rgba(255, 62, 219, 0.34);
      background:
        linear-gradient(135deg, rgba(255, 62, 219, 0.22), rgba(141, 92, 255, 0.16)),
        rgba(255, 255, 255, 0.07);
    }

    .winner-display {
      min-height: 36px;
      color: var(--green);
      font-size: clamp(18px, 2.4vw, 25px);
      font-weight: 900;
      text-align: center;
      text-shadow: 0 0 16px rgba(124, 255, 196, 0.55);
    }

    .museum-button:disabled,
    .museum-field:disabled {
      cursor: not-allowed;
      filter: grayscale(0.35);
      opacity: 0.5;
      transform: none;
    }

    @media (max-width: 820px) {
      .roulette-stage { min-height: auto; }
      .main-container { grid-template-columns: 1fr; }
      .wheel-frame { width: min(82vw, 400px); }
      .right-section {
        width: min(100%, 520px);
        margin: 0 auto;
      }
    }

    @media (max-width: 480px) {
      .roulette-stage { padding-inline: 14px; }
      .stage-intro { margin-bottom: 22px; }
      .pointer {
        right: -12px;
        border-top-width: 9px;
        border-bottom-width: 9px;
        border-right-width: 32px;
      }
      textarea { min-height: 150px; }
    }
  </style>
</head>
<body class="gate-page">
  <div id="app" v-cloak>
    <main class="gate-shell">
      <header class="gate-topbar" aria-label="サイトヘッダー">
        <div class="gate-brand">
          <span class="gate-brand-mark" aria-hidden="true"></span>
          Pii-chan Future Museum
        </div>
        <span class="gate-label">GATE 01</span>
        <a class="home-link return-button" href="index.html">Return to HOME</a>
      </header>

      <section class="gate-stage roulette-stage" aria-labelledby="roulette-title">
        <div class="stage-intro">
          <h1 class="gate-heading" id="roulette-title">豪華ルーレット</h1>
        </div>

        <div class="main-container">
          <div class="roulette-container">
            <div class="wheel-frame">
              <div class="pointer" aria-hidden="true"></div>
              <canvas id="wheel-canvas" width="400" height="400"></canvas>
            </div>
            <div class="winner-display" v-if="winner">
              🎉 当選者: {{ winner }} 🎉
            </div>
          </div>

          <div class="right-section glass-card">
            <textarea
              class="museum-field"
              v-model="participantsText"
              :disabled="isSpinning"
              placeholder="参加者を入力 (一行につき一人)"
              aria-label="参加者を入力 (一行につき一人)"
            ></textarea>
            <div class="buttons">
              <button class="museum-button" id="spin-btn" type="button" :disabled="isSpinning || participants.length === 0" @click="spinWheel">開始</button>
              <button class="museum-button" id="reset-btn" type="button" :disabled="isSpinning" @click="resetWheel">リセット</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          participantsText: '',
          rotation: 0,
          isSpinning: false,
          winner: null,
        };
      },
      computed: {
        participants() {
          return this.participantsText.split('\n').filter(p => p.trim() !== '');
        }
      },
      watch: {
        participantsText() {
          this.rotation = 0;
          this.winner = null;
          this.drawWheel();
        }
      },
      methods: {
        drawWheel(rotationDegrees = this.rotation) {
          const canvas = document.getElementById('wheel-canvas');
          const ctx = canvas.getContext('2d');
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const radius = canvas.width / 2 - 5;

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (this.participants.length === 0) {
            ctx.fillStyle = '#a8b8d8';
            ctx.font = '20px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('参加者を追加してください', centerX, centerY);
            return;
          }

          if (this.participants.length === 1) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'hsl(188, 78%, 68%)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(2, 4, 13, 0.5)';
            ctx.stroke();
            ctx.fillStyle = '#02040d';
            ctx.font = '700 18px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.participants[0], centerX, centerY, radius * 1.35);
            return;
          }

          const segmentAngle = (2 * Math.PI) / this.participants.length;
          const labelSize = Math.max(9, Math.min(16, 48 / Math.sqrt(this.participants.length)));

          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate((rotationDegrees * Math.PI) / 180);

          this.participants.forEach((participant, index) => {
            const startAngle = index * segmentAngle;
            const endAngle = startAngle + segmentAngle;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = `hsl(${(index * 360) / this.participants.length}, 78%, 68%)`;
            ctx.fill();
            ctx.strokeStyle = 'rgba(2, 4, 13, 0.5)';
            ctx.stroke();

            ctx.save();
            ctx.rotate(startAngle + segmentAngle / 2);
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#02040d';
            ctx.font = `700 ${labelSize}px "Segoe UI", sans-serif`;
            ctx.fillText(participant, radius - 14, 0, radius * 0.7);
            ctx.restore();
          });

          ctx.restore();
        },
        randomIndex(length) {
          if (length <= 1) return 0;

          if (window.crypto && window.crypto.getRandomValues) {
            const values = new Uint32Array(1);
            const limit = 0x100000000 - (0x100000000 % length);
            do {
              window.crypto.getRandomValues(values);
            } while (values[0] >= limit);
            return values[0] % length;
          }

          return Math.floor(Math.random() * length);
        },
        spinWheel() {
          if (this.isSpinning || this.participants.length === 0) return;

          this.isSpinning = true;
          const spinDuration = 3000;
          const startRotation = this.rotation;
          const winnerIndex = this.randomIndex(this.participants.length);
          const segmentDegrees = 360 / this.participants.length;
          const targetRotation = (360 - ((winnerIndex + 0.5) * segmentDegrees)) % 360;
          const startNormalized = ((startRotation % 360) + 360) % 360;
          const alignmentRotation = (targetRotation - startNormalized + 360) % 360;
          const fullTurns = 8 + this.randomIndex(5);
          const totalRotation = fullTurns * 360 + alignmentRotation;
          const startTime = performance.now();

          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / spinDuration, 1);
            const easing = 1 - Math.pow(1 - progress, 3);
            this.rotation = startRotation + totalRotation * easing;
            this.drawWheel(this.rotation);

            if (progress < 1) {
              requestAnimationFrame(animate);
            } else {
              this.isSpinning = false;
              this.rotation = targetRotation;
              this.drawWheel(this.rotation);
              this.winner = this.participants[winnerIndex];
            }
          };

          requestAnimationFrame(animate);
        },
        resetWheel() {
          this.rotation = 0;
          this.participantsText = '';
          this.winner = null;
          this.drawWheel();
        },
      },
      mounted() {
        this.drawWheel();
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
